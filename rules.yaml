version: algorithm_v2_mvp

artwork_types:
  watercolor:
    glass:
      required: true
      default: museum
    mat:
      default: true
    shadow_box: false
    frame:
      min_depth_mm: null
      preferred_profiles: [flat, box]

  photo:
    glass:
      required: true
      default: museum
    mat:
      default: true
      note: "Modern full-bleed photo can become an explicit option later."
    shadow_box: false
    frame:
      min_depth_mm: null
      preferred_profiles: [flat, box]

  poster:
    glass:
      required: true
      default: ordinary
      signature: museum
    mat:
      default: true
      conditional_rule: "Disable mat only when frame_occupancy is high and decor_style is modern or signature."
    shadow_box: false
    frame:
      min_depth_mm: null
      preferred_profiles: [flat, box]

  canvas:
    glass:
      required: false
      default: none
    mat:
      default: false
    shadow_box: false
    frame:
      min_depth_mm: 35
      preferred_profiles: [l_shape, box, float]

  volumetric:
    glass:
      required: true
      default: ordinary
      signature: museum
    mat:
      default: false
    shadow_box: true
    spacer: true
    frame:
      min_depth_mm: 45
      preferred_profiles: [gallery_box]

size_profiles:
  small:
    longer_side_max_mm: 420
  medium:
    longer_side_max_mm: 700
  large:
    longer_side_max_mm: 1000
  extra_large:
    longer_side_min_mm: 1001

decor_styles:
  standard:
    mat_percent:
      small: 0.35
      medium: 0.30
      large: 0.25
      extra_large: 0.15
    bottom_weight: 1.15
    double_mat: false
  modern:
    mat_percent:
      small: 0.45
      medium: 0.40
      large: 0.35
      extra_large: 0.18
    bottom_weight: 1.15
    double_mat: false
  signature:
    mat_percent:
      small: 0.55
      medium: 0.50
      large: 0.45
      extra_large: 0.20
    bottom_weight: 1.20
    double_mat: true

mat_geometry:
  min_mat_mm: 35
  max_mat_mm: 140
  extra_large_min_mat_mm: 50
  extra_large_max_mat_mm: 160
  overlap_mm: 4
  inner_reveal_mm: 6

interior_style_frame_candidates:
  minimal: [black_wood, white_oak, natural_oak, graphite_aluminum]
  scandi: [light_oak, white_oak, natural_oak]
  japandi: [natural_oak, walnut, black_wood]
  contemporary: [black_aluminum, graphite_aluminum, white_oak]
  loft: [black_aluminum, graphite_aluminum, champagne_aluminum]
  modern_vintage: [walnut, champagne_aluminum, black_wood]
  neoclassic: [walnut, matte_gold, matte_silver]
  universal: [natural_oak, black_wood, graphite_aluminum]

frame_widths_mm:
  small:
    low: {wood: 15, aluminum: 10}
    medium: {wood: 15, aluminum: 10}
    high: {wood: 20, aluminum: 12}
  medium:
    low: {wood: 20, aluminum: 12}
    medium: {wood: 20, aluminum: 12}
    high: {wood: 30, aluminum: 15}
  large:
    low: {wood: 30, aluminum: 15}
    medium: {wood: 35, aluminum: 18}
    high: {wood: 40, aluminum: 20}
  extra_large:
    low: {wood: 40, aluminum: 20}
    medium: {wood: 50, aluminum: 22}
    high: {wood: 50, aluminum: 25}

frame_catalog_additions:
  canvas_float_oak:
    material: wood
    color_family: natural_oak
    depth_mm: 40
    profile: float
  canvas_float_black:
    material: wood
    color_family: black
    depth_mm: 40
    profile: float
